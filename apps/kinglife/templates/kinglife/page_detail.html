{% extends 'kinglife/base.html' %}

{% block title %}{{ page.titre }} - KINGLIFE SHAL U{% endblock %}

{% block content %}
<section class="hero" style="padding: 60px 0;">
    <div class="container">
        <h1>{{ page.titre }}</h1>
    </div>
</section>

<section>
    <div class="container">
        <div style="max-width: 800px; margin: 0 auto;">
            {% if page.image %}
                <img src="{{ page.image.url }}" alt="{{ page.titre }}" style="width: 100%; height: 400px; object-fit: cover; border-radius: 10px; margin-bottom: 30px;">
            {% endif %}
            <div style="color: #cccccc; line-height: 1.8; font-size: 18px;">
                {{ page.contenu|linebreaks }}
            </div>
        </div>
    </div>
</section>
{% endblock %}
