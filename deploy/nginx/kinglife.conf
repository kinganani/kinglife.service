# ==========================================================================
# KINGLIFE SHAL U - NGINX CONFIGURATION FOR PRODUCTION VPS (LINUX UBUNTU)
# Reverse Proxy, SSL HTTPS & Static File Serving
# ==========================================================================

server {
    listen 80;
    server_name kinglife.dev www.kinglife.dev;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name kinglife.dev www.kinglife.dev;

    # SSL Certificate Paths (Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/kinglife.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kinglife.dev/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 25M;

    # Serve Static Files Directly
    location /static/ {
        alias /var/www/kinglife.dev/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Serve Media Uploads Directly
    location /media/ {
        alias /var/www/kinglife.dev/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy Requests to Gunicorn Application Server
    location / {
        proxy_pass http://unix:/run/gunicorn_kinglife.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
